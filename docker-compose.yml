services:

  db:
    image: postgres:16-alpine
    container_name: backupthink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backupthink-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backupthink-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-backupthink}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-backupthink}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver

      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_SHOW_SQL: "false"

      GITHUB_AUTHOR: ${GITHUB_AUTHOR}
      GITHUB_EMAIL: ${GITHUB_EMAIL}
      GITHUB_URL: ${GITHUB_URL}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    networks:
      - backupthink-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: backupthink-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - backupthink-net

volumes:
  postgres_data:

networks:
  backupthink-net:
    driver: bridge
